[package]
name = "membench"
version = "2.0.0"
edition = "2024"
description = "Benchmark contracts and tooling for memory systems"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/jak-pan/symbiotic-mem-bench"
publish = false
autobins = false
autotests = false

[features]
default = []
# Dashboard backend. Feature-gated so the core harness and `cargo test` stay lean.
server = ["dep:axum", "dep:rusqlite", "dep:tokio", "dep:tower-http"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
prost-types = "0.14"
rusqlite = { version = "0.37", features = ["bundled", "chrono"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["fs", "cors"], optional = true }
tempfile = "3"
libc = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[[bin]]
name = "membench-server"
path = "src/bin/membench-server.rs"
required-features = ["server"]

[[bin]]
name = "membench-leaderboard"
path = "src/bin/membench-leaderboard.rs"
# Core-only (clap + lib): intentionally builds without any cargo features.

[[bin]]
name = "membench-product-conformance"
path = "src/bin/membench-product-conformance.rs"
